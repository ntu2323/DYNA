syntax = "proto2";

package specpaxos.dyna.proto;

// DYNA wire messages (spec §2). Every message carries the transaction's
// identity (client_id, request_id) and view_id unless noted. OrderKey and TxnId
// are computed locally on each server and are NOT sent (spec §1.1).

enum TxnType {
    WRITE = 0;   // pure blind write (wSet only)
    READ  = 1;   // pure read (rSet only); RMW deferred (§0.4)
}

// A single written key/value pair (proto2 has no first-class map on the wire).
message KV {
    required bytes key   = 1;
    required bytes value = 2;
}

// §1.2 the transaction body a client multicasts. `t` is the client-assigned
// deadline (physical component of OrderKey); it may be advanced, never lowered.
message Txn {
    required uint64  client_id  = 1;   // TxnId.client
    required uint64  request_id = 2;   // TxnId.request (unique per client)
    required TxnType type       = 3;
    repeated bytes   r_set      = 4;   // keys read       (empty for pure WRITE)
    repeated KV      w_set      = 5;   // keys+values written (empty for pure READ)
    required uint64  t          = 6;   // client-assigned deadline (µs)
    required uint64  view_id    = 7;
    optional uint64  send_time  = 8;   // µs, client send stamp (replica learns OWD, §2)
}

// 1. ClientRequest — client → all servers (multicast / retry).
message ClientRequest {
    required Txn txn = 1;
}

// 2. SpecReply — server → client, after the server releases the txn.
message SpecReply {
    required uint64 client_id    = 1;   // txnId
    required uint64 request_id   = 2;
    required uint64 view_id      = 3;
    required uint32 server_id    = 4;
    required uint64 t            = 5;   // the LIVE timestamp this server released at
    required bool   is_leader    = 6;   // true iff this server leads a key in the txn
    repeated KV     results      = 7;   // READ + leader only: disk-read values
    required uint64 owd_estimate = 8;   // µs, piggybacked OWD feedback
}

// 3. RejectReply — UNUSED: a late READ at a follower is now dropped silently (the
//    client retries on timeout). Kept so the message numbering stays stable.
message RejectReply {
    required uint64 client_id  = 1;
    required uint64 request_id = 2;
    required uint64 view_id    = 3;
    required uint32 server_id  = 4;
}

// 4. FastCommit — client → all servers after fast-path quorum.
message FastCommit {
    required uint64 client_id  = 1;
    required uint64 request_id = 2;
    required uint64 view_id    = 3;
    required uint64 agreed_t   = 4;   // commonly-agreed timestamp (all leaders matched)
}

// 5. SlowCommit — client → all servers when leaders' timestamps disagreed.
message SlowCommit {
    required uint64 client_id  = 1;
    required uint64 request_id = 2;
    required uint64 view_id    = 3;
    required uint64 agreed_t   = 4;   // max over involved leaders' proposed timestamps
}

// 6. CommitReply — server → client in response to a SlowCommit (quorum re-check).
message CommitReply {
    required uint64 client_id  = 1;
    required uint64 request_id = 2;
    required uint64 view_id    = 3;
    required uint32 server_id  = 4;
    required uint64 t          = 5;   // == agreed_t after the server adopted it
    required bool   is_leader  = 6;
}

// 7. FetchRequest — server → server, pull a missing txn body from a peer.
message FetchRequest {
    required uint64 client_id    = 1;   // txnId of the wanted body
    required uint64 request_id   = 2;
    required uint64 view_id      = 3;
    required uint32 requester_id = 4;
}

// 8. FetchReply — server → server, the requested txn body.
message FetchReply {
    required Txn txn = 1;               // txnId+viewId are inside the body
}

// 9. TsAgree — leader → other involved leaders (background ts-agreement, §3.5).
message TsAgree {
    required uint64 client_id  = 1;
    required uint64 request_id = 2;
    required uint64 view_id    = 3;
    required uint32 sender_id  = 4;
    required uint64 proposed_t = 5;    // this leader's current live t for the txn
    optional bool   reply      = 6;    // answers a peer's TsAgree (never itself answered)
}

// 10. ReplicatePrepare — leader → all other servers (durability of agreed order).
message ReplicatePrepare {
    required uint64 client_id  = 1;
    required uint64 request_id = 2;
    required uint64 view_id    = 3;
    required uint32 leader_id  = 4;
    required uint64 agreed_t   = 5;
    optional Txn    txn        = 6;    // optional body so a lacking follower can materialize
}

// 11. ReplicatePrepareReply — server → leader, ack of ReplicatePrepare.
message ReplicatePrepareReply {
    required uint64 client_id  = 1;
    required uint64 request_id = 2;
    required uint64 view_id    = 3;
    required uint32 server_id  = 4;
}

// 12. ReplicateCommit — leader → all other servers, txn durably committed.
message ReplicateCommit {
    required uint64 client_id  = 1;
    required uint64 request_id = 2;
    required uint64 view_id    = 3;
    required uint32 leader_id  = 4;
}

// ---------------------------------------------------------------------------------------
// Views + recovery (design doc § Recovery). A view is (view_id, alive set); `alive` is a
// bitmask over server ids (bit i ⇔ server i alive). The VR layer is silent in normal
// operation apart from heartbeats; it only changes views. The VR leader of a view is the
// min-id alive server.
// ---------------------------------------------------------------------------------------

// 13. Heartbeat — server → all servers, periodic failure detection.
message Heartbeat {
    required uint64 view_id   = 1;
    required uint32 sender_id = 2;
}

// 14. StartViewChange — server → all: propose / join the change to view_id with `alive`.
message StartViewChange {
    required uint64 view_id   = 1;
    required uint32 sender_id = 2;
    required uint64 alive     = 3;
}

// 15. DoViewChange — server → new VR leader, after f matching StartViewChanges.
message DoViewChange {
    required uint64 view_id   = 1;
    required uint32 sender_id = 2;
    required uint64 alive     = 3;
    required uint64 old_alive = 4;   // sender's last NORMAL alive set
    optional uint64 last_normal_view = 5;   // the view whose alive set old_alive is
}

// 16. StartRecovery — VR leader → all, once f+1 servers agreed on the view change: every
//     survivor pauses normal processing and acts as Partition Leader for its delta-p.
message StartRecovery {
    required uint64 view_id   = 1;
    required uint32 sender_id = 2;
    required uint64 alive     = 3;
    required uint64 old_alive = 4;   // the view being replaced (defines the failed range)
}

// A transaction copy reported for recovery: its body, live t and status.
message RecTxn {
    required Txn    txn    = 1;
    required uint64 t      = 2;
    required uint32 status = 3;      // 0 SPECULATIVE, 1 COMMITTING, 2 COMMITTED
}

// An executed key-value with the commit timestamp of the write that produced it.
message RecKV {
    required bytes  key   = 1;
    required bytes  value = 2;
    required uint64 t     = 3;
}

// 17. RecoveryRequest — PL → all alive servers: send me what you hold in my delta-p.
//     Carries the view so a server that missed StartRecovery can join it.
message RecoveryRequest {
    required uint64 view_id      = 1;
    required uint32 requester_id = 2;
    required uint64 alive        = 3;
    required uint64 old_alive    = 4;
}

// 18. RecoveryReply — server → PL: its spec/committing/committed txns and executed
//     key-values in the PL's delta-p.
message RecoveryReply {
    required uint64 view_id   = 1;
    required uint32 sender_id = 2;
    repeated RecTxn txns      = 3;
    repeated RecKV  kvs       = 4;
}

// 19. RecoveryPrepare — PL → all alive servers: the merged buffer M for its delta-p.
message RecoveryPrepare {
    required uint64 view_id   = 1;
    required uint32 sender_id = 2;
    required uint64 alive     = 3;
    required uint64 old_alive = 4;
    repeated RecTxn txns      = 5;
    repeated RecKV  kvs       = 6;
}

// 20. RecoveryPrepareReply — server → PL: M buffered.
message RecoveryPrepareReply {
    required uint64 view_id   = 1;
    required uint32 sender_id = 2;
    required uint32 pl_id     = 3;
}

// 21. RecoveryReport — PL → VR leader: f+1 servers hold my M.
message RecoveryReport {
    required uint64 view_id   = 1;
    required uint32 sender_id = 2;
}

// 22. StartView — VR leader → all: every PL reported; install the buffered Ms and resume.
message StartView {
    required uint64 view_id   = 1;
    required uint32 sender_id = 2;
    required uint64 alive     = 3;
}

// 23. ViewInfo — server → client whose request carried an old view.
message ViewInfo {
    required uint64 view_id = 1;
    required uint64 alive   = 2;
}

// ---------------------------------------------------------------------------------------
// Rejoin. A restarted server (it finds its persisted VR state file) starts JOINING: it
// learns the current view, adopts it as a NON-member, catches up via a chunked snapshot
// from the VR leader (while also applying live replication traffic), then asks to be
// added; the VR leader runs a normal view change that adds it, in which consistent
// hashing hands its home range back (it is PL for exactly that range).
// ---------------------------------------------------------------------------------------

// 24. JoinRequest — joiner → all: I restarted (lost my in-memory state); what's the view?
message JoinRequest {
    required uint32 sender_id = 1;
}

// 25. JoinInfo — member → joiner: the current view (the joiner is not in `alive`).
message JoinInfo {
    required uint64 view_id   = 1;
    required uint32 sender_id = 2;
    required uint64 alive     = 3;
}

// 26. SnapshotRequest — joiner → donor (VR leader): the next chunk of executed state.
message SnapshotRequest {
    required uint64 view_id      = 1;
    required uint32 requester_id = 2;
    required uint64 session      = 3;   // a new session restarts the key enumeration
    required uint64 offset       = 4;   // index into the donor's sorted key list
}

// 27. SnapshotChunk — donor → joiner: up to DYNA_SNAPSHOT_CHUNK executed key-values (with
//     their t); the last chunk also carries the donor's COMMITTING/COMMITTED write txns.
message SnapshotChunk {
    required uint64 view_id   = 1;
    required uint32 sender_id = 2;
    required uint64 session   = 3;
    required uint64 offset    = 4;
    required uint64 total     = 5;
    required bool   done      = 6;
    repeated RecKV  kvs       = 7;
    repeated RecTxn txns      = 8;
    required uint64 next_offset = 9;   // where the joiner's next request starts
}

// 28. JoinReady — joiner → VR leader: caught up; add me (view change to view_id + 1).
message JoinReady {
    required uint64 view_id   = 1;
    required uint32 sender_id = 2;
}
