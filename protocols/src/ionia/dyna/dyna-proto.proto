syntax = "proto2";

package specpaxos.dyna.proto;

message RequestMessage {
  required uint32 partition_id = 1;
  required uint64 client_id = 2;
  required uint64 request_id = 3;
  required bytes command = 4;
  required uint64 send_time_us = 5;
  required uint64 deadline_us = 6;
  required bool is_read = 7;
}

message FastReply {
  required uint32 partition_id = 1;
  required uint64 request_id = 2;
  required uint32 replica_id = 3;
  required uint64 view_id = 4;
  required uint64 deadline_us = 5;
  optional uint64 owd_us = 6;
}

message ReadResult {
  required uint32 partition_id = 1;
  required uint64 request_id = 2;
  required uint64 view_id = 3;
  required uint64 deadline_us = 4;
  required bytes data = 5;
  optional uint64 owd_us = 6;
}

message SyncBroadcast {
  required uint32 partition_id = 1;
  required uint64 view_id = 2;
  required uint64 log_index = 3;
  required uint64 client_id = 4;
  required uint64 request_id = 5;
  required uint64 deadline_us = 6;
}

message SyncAck {
  required uint32 partition_id = 1;
  required uint64 view_id = 2;
  required uint32 replica_id = 3;
  required uint64 log_index = 4;
  required uint64 client_id = 5;
  required uint64 request_id = 6;
  required uint64 deadline_us = 7;
}

message CommitBroadcast {
  required uint32 partition_id = 1;
  required uint64 view_id = 2;
  required uint64 up_to_log_index = 3;
}

message LateSyncBroadcast {
  required uint32 partition_id = 1;
  required uint64 view_id = 2;
  required uint64 log_index = 3;
  required uint64 client_id = 4;
  required uint64 request_id = 5;
  required uint64 old_deadline_us = 6;
  required uint64 new_deadline_us = 7;
}

message FetchRequest {
  required uint32 partition_id = 1;
  required uint64 client_id = 2;
  required uint64 request_id = 3;
}

message FetchResponse {
  required uint32 partition_id = 1;
  required uint64 client_id = 2;
  required uint64 request_id = 3;
  required bytes command = 4;
  required uint64 send_time_us = 5;
  required bool is_read = 6;
}
