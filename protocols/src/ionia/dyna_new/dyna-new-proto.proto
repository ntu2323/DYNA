syntax = "proto2";

package specpaxos.dyna_new.proto;

enum RequestType {
    BLIND_WRITE = 0;
    READ_ONLY   = 1;
    RMW         = 2;
}

// client → all replicas  (§4)
message Request {
    required uint64 client_id  = 1;
    required uint64 request_id = 2;
    required RequestType type  = 3;
    required bytes key         = 4;
    required bytes command     = 5;  // opaque; empty for READ_ONLY
    required uint64 send_time  = 6;  // µs, synchronized wall clock
    required uint64 deadline   = 7;  // µs, synchronized wall clock
}

// replica → client  (§4; is_leader distinguishes leader data reply from follower endorsement)
message Reply {
    required uint64 view_id      = 1;
    required uint32 replica_id   = 2;
    required uint32 partition_id = 3;
    required uint64 client_id    = 4;
    required uint64 request_id   = 5;
    required uint64 deadline     = 6;  // leader-authoritative deadline
    required bool   is_leader    = 7;
    optional bytes  result       = 8;  // populated only in leader reply for READ_ONLY / RMW
    required uint64 owd_estimate = 9;  // µs, piggybacked OWD feedback for deadline computation
    optional uint64 log_pos      = 10; // leader's log position (read commit rule)
}

// partition leader → followers  (§4; also serves as heartbeat)
message Sync {
    required uint64 view_id      = 1;
    required uint32 partition_id = 2;
    required uint64 log_id       = 3;
    required uint64 client_id    = 4;
    required uint64 request_id   = 5;
    required uint64 deadline     = 6;  // leader-authoritative (may differ from original)
}

// follower → partition leader  (§4)
message SyncConfirm {
    required uint64 view_id      = 1;
    required uint32 replica_id   = 2;
    required uint32 partition_id = 3;
    required uint64 client_id    = 4;
    required uint64 request_id   = 5;
    required uint64 deadline     = 6;
}

// partition leader → followers, background  (§4)
message Commit {
    required uint64 view_id      = 1;
    required uint32 partition_id = 2;
    required uint64 client_id    = 3;
    required uint64 request_id   = 4;
}

// follower → leader when sync arrives for a request the follower never saw  (§4)
message FetchRequest {
    required uint32 partition_id = 1;
    required uint64 client_id    = 2;
    required uint64 request_id   = 3;
}

// leader → follower response  (§4)
message FetchResponse {
    required uint32 partition_id = 1;
    required uint64 client_id    = 2;
    required uint64 request_id   = 3;
    required bytes  key          = 4;
    required bytes  command      = 5;
    required uint64 send_time    = 6;
    required RequestType type    = 7;
}
